<!DOCTYPE html>
<html lang="{{ lang | default('ua') }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ t('page.title') if t is defined else 'Pravdalist' }}{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous" />
  <link rel="stylesheet" href="/static/css/site.css" />
</head>
<body>

{% block header %}
  {% include "partials/header.html" %}
{% endblock %}

<section id="tiles-section" class="container-fluid py-3 bg-light">
  {% block tiles %}
    {% include "partials/tiles.html" %}
  {% endblock %}
</section>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

{% block footer %}
  {% include "partials/footer.html" %}
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/lang-switcher.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
