[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locale-editor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "deep-translator>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["locale_editor*"]
